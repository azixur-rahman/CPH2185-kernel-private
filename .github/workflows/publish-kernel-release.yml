name: Publish kernel artifact to release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Actions run id that contains the kernel artifact
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download kernel artifact
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: Falcon-AZ-CPH2185-CPH2179-*
          path: dist
          merge-multiple: true

      - name: Show files
        run: find dist -maxdepth 2 -type f -printf '%p %s\n'

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          ZIP=$(find dist -type f -name '*.zip' | head -n1)
          test -n "$ZIP"
          NAME=$(basename "$ZIP")
          SIZE=$(stat -c %s "$ZIP")
          SHA=$(sha256sum "$ZIP" | cut -d' ' -f1)
          {
            echo "name=$NAME"
            echo "size=$SIZE"
            echo "sha256=$SHA"
            echo "run_id=${{ inputs.run_id }}"
            echo "commit=${{ github.sha }}"
          } > Falcon-AZ-KERNEL-INFO.txt
          gh release upload private-source-backup "$ZIP" --clobber --repo "${{ github.repository }}"
          gh release upload private-source-backup Falcon-AZ-KERNEL-INFO.txt --clobber --repo "${{ github.repository }}"
          echo "Uploaded $NAME ($SIZE bytes)"
          echo "SHA256=$SHA"
