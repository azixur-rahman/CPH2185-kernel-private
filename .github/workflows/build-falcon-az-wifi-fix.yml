name: Build Falcon-AZ CPH2185 CPH2179 Stock Module WiFi Fix KSU

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout packaging repo
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            flex \
            gcc-aarch64-linux-gnu \
            libelf-dev \
            libncurses5-dev \
            libssl-dev \
            python3 \
            zip

      - name: Download CPH2185 source
        run: |
          curl -L --retry 5 --retry-all-errors -o source.tar.gz \
            "https://codeload.github.com/leonardrua/kernel_oppo_CPH2185/tar.gz/a241505b43662495457ebba72bc6685f756dbfa8"
          mkdir -p src
          tar -xzf source.tar.gz -C src --strip-components=1
          test -f src/arch/arm64/configs/CPH2185_defconfig

      - name: Setup KernelSU BakaSU and SUSFS
        working-directory: src
        run: |
          curl -LSs "https://raw.githubusercontent.com/leonardrua/BakaSU/main/kernel/setup.sh" | bash -s main
          test -d KernelSU/kernel
          grep -q 'kernelsu' drivers/Makefile
          grep -q 'drivers/kernelsu/Kconfig' drivers/Kconfig

      - name: Apply stock module flow and module loading
        working-directory: src
        run: |
          set -e

          # Keep only connadp (the platform bridge exported to the stock
          # connectivity modules) built in. WMT/WLAN/BT/GPS/FM must stay
          # as the stock vendor modules, exactly like the stock kernel.
          python3 - <<'PY'
          import pathlib
          import re

          p = pathlib.Path('drivers/misc/mediatek/connectivity/Makefile')
          lines = p.read_text().splitlines()
          changed = []
          for i, line in enumerate(lines):
              if re.match(r'^\s*obj-\$\(CONFIG_MTK_[A-Z0-9_]+\)', line):
                  lines[i] = '# ' + line
                  changed.append(line.strip())
          p.write_text('\n'.join(lines) + '\n')

          expected = [
              'obj-$(CONFIG_MTK_COMBO) += common/',
              'obj-$(CONFIG_MTK_COMBO_WIFI) += wlan/adaptor/',
              'obj-$(CONFIG_MTK_COMBO_CHIP_CONSYS_6765) += wlan/core/gen4m/',
              'obj-$(CONFIG_MTK_COMBO_BT) += bt/mt66xx/',
              'obj-$(CONFIG_MTK_COMBO_GPS) += gps/',
              'obj-$(CONFIG_MTK_FMRADIO) += fmradio/',
          ]
          for entry in expected:
              if entry not in changed:
                  raise SystemExit('failed to disable built-in ' + entry)

          text = p.read_text()
          if 'obj-y += $(MODULE_NAME).o' not in text:
              raise SystemExit('connadp build entry disappeared')
          PY

          grep -q 'obj-y += $(MODULE_NAME).o' drivers/misc/mediatek/connectivity/Makefile
          ! grep -qE '^[[:space:]]*obj-\$\(CONFIG_MTK_' drivers/misc/mediatek/connectivity/Makefile

          # Never enter the vendor-symlink branch: standalone CI has no
          # ../vendor/mediatek/kernel_modules tree.
          sed -i '/^CONFIG_WLAN_DRV_BUILD_IN=/d' arch/arm64/configs/CPH2185_defconfig

          # Allow the stock vendor modules to load even when their
          # modversions CRCs or vermagic differ from this build.
          python3 - <<'PY'
          import pathlib

          p = pathlib.Path('kernel/module.c')
          s = p.read_text()
          old = ('\t//FIXME\n'
                 '\tflags |= MODULE_INIT_IGNORE_MODVERSIONS;\n'
                 '\tflags |= MODULE_INIT_IGNORE_VERMAGIC;\n')
          new = ('\t/* Load the stock vendor modules even when their symbol CRCs differ. */\n'
                 '\tflags |= MODULE_INIT_IGNORE_MODVERSIONS;\n'
                 '\tflags |= MODULE_INIT_IGNORE_VERMAGIC;\n')
          if old in s:
              s = s.replace(old, new, 1)
          elif 'MODULE_INIT_IGNORE_MODVERSIONS' not in s or 'MODULE_INIT_IGNORE_VERMAGIC' not in s:
              marker = '\tchar *after_dashes;\n\n'
              if marker not in s:
                  raise SystemExit('load_module insertion point not found')
              s = s.replace(marker, marker + new, 1)
          if 'module_blacklist = "wmt_drv"' in s:
              raise SystemExit('unexpected wmt_drv blacklist still present')
          p.write_text(s)
          PY

          grep -q 'MODULE_INIT_IGNORE_MODVERSIONS' kernel/module.c
          grep -q 'MODULE_INIT_IGNORE_VERMAGIC' kernel/module.c
          ! grep -q 'module_blacklist = "wmt_drv"' kernel/module.c

          # Force load/unload support, and no module signature gate.
          sed -i 's/^# CONFIG_MODULE_FORCE_LOAD is not set/CONFIG_MODULE_FORCE_LOAD=y/' arch/arm64/configs/CPH2185_defconfig
          sed -i 's/^# CONFIG_MODULE_FORCE_UNLOAD is not set/CONFIG_MODULE_FORCE_UNLOAD=y/' arch/arm64/configs/CPH2185_defconfig
          grep -q '^CONFIG_MODULE_FORCE_LOAD=y' arch/arm64/configs/CPH2185_defconfig
          grep -q '^CONFIG_MODULE_FORCE_UNLOAD=y' arch/arm64/configs/CPH2185_defconfig

          # Stock modules require vermagic 4.9.190+ exactly.
          sed -i 's/^CONFIG_LOCALVERSION=.*/CONFIG_LOCALVERSION="+"/' arch/arm64/configs/CPH2185_defconfig
          sed -i 's/^CONFIG_LOCALVERSION_AUTO=.*/CONFIG_LOCALVERSION_AUTO=n/' arch/arm64/configs/CPH2185_defconfig
          grep -q '^CONFIG_LOCALVERSION="+"' arch/arm64/configs/CPH2185_defconfig
          grep -q '^CONFIG_LOCALVERSION_AUTO=n' arch/arm64/configs/CPH2185_defconfig

          # Keep the known-working touch configuration.
          grep -q '^CONFIG_TOUCHSCREEN_NT36xxx_HOSTDL_SPI=y' arch/arm64/configs/CPH2185_defconfig
          if ! grep -q 'novatek,swrst-n8-addr' arch/arm64/boot/dts/mediatek/oppo6765.dts; then
              git apply ../packaging/falcon-az-touch-fix.patch
          fi
          grep -q 'novatek,swrst-n8-addr' arch/arm64/boot/dts/mediatek/oppo6765.dts

          # Keep the Falcon-AZ display name without changing UTS_RELEASE.
          # UTS_RELEASE stays 4.9.190+ so stock vendor module vermagic matches.
          python3 - <<'PY'
          import pathlib

          p = pathlib.Path('init/version.c')
          s = p.read_text()
          s = s.replace('.release\t= UTS_RELEASE,', '.release\t= "4.9.190-falcon-az",')
          s = s.replace('"Linux version " UTS_RELEASE', '"Linux version 4.9.190-falcon-az"')
          p.write_text(s)
          PY
          grep -q '4.9.190-falcon-az' init/version.c
          grep -nE 'CONFIG_LOCALVERSION|CONFIG_LOCALVERSION_AUTO' arch/arm64/configs/CPH2185_defconfig

      - name: Build kernel and DTBs
        working-directory: src
        env:
          ARCH: arm64
          CROSS_COMPILE: aarch64-linux-gnu-
          ODM_WT_EDIT: "yes"
          VENDOR_EDIT: "1"
        run: |
          make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CPH2185_defconfig
          make -j"$(nproc)" O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- Image.gz-dtb dtbs
          test -s out/arch/arm64/boot/Image.gz-dtb
          ls -lh out/arch/arm64/boot/Image.gz-dtb
          cp out/.config ../Falcon-AZ-config
          cp out/System.map ../Falcon-AZ-System.map || true
          grep -E '^CONFIG_LOCALVERSION|^CONFIG_KSU|^CONFIG_KSU_SUSFS|^CONFIG_MODULE_FORCE|^CONFIG_MODVERSIONS' ../Falcon-AZ-config | head -30

      - name: Verify Falcon-AZ stock module WiFi build
        working-directory: src
        run: |
          set -ex
          echo '== config checks =='
          grep -q '^CONFIG_LOCALVERSION="+"' ../Falcon-AZ-config
          grep -qE '^(CONFIG_LOCALVERSION_AUTO=n|# CONFIG_LOCALVERSION_AUTO is not set)$' ../Falcon-AZ-config
          grep -q '^CONFIG_KSU=y' ../Falcon-AZ-config
          grep -q '^CONFIG_KSU_SUSFS=y' ../Falcon-AZ-config
          grep -q '^CONFIG_MODVERSIONS=y' ../Falcon-AZ-config
          grep -q '^CONFIG_MODULE_FORCE_LOAD=y' ../Falcon-AZ-config
          grep -q '^CONFIG_MODULE_FORCE_UNLOAD=y' ../Falcon-AZ-config

          echo '== kernel release checks =='
          test "$(cat out/include/config/kernel.release)" = "4.9.190+"
          grep -q '#define UTS_RELEASE "4.9.190+"' out/include/generated/utsrelease.h

          echo '== built files =='
          ls -lh out/vmlinux out/arch/arm64/boot/Image out/kernel/module.o out/arch/arm64/boot/Image.gz-dtb

          echo '== display and vermagic checks =='
          grep -aob '4.9.190-falcon-az' out/vmlinux | head -3
          grep -aob '4.9.190-falcon-az' out/arch/arm64/boot/Image | head -3
          grep -aob '4.9.190+ SMP preempt mod_unload modversions aarch64' out/kernel/module.o | head -3
          grep -aob '4.9.190+ SMP preempt mod_unload modversions aarch64' out/vmlinux | head -3

          echo '== connadp bridge checks =='
          grep -q ' wmt_export_platform_bridge_register$' ../Falcon-AZ-System.map
          grep -q ' wifi_irq$' ../Falcon-AZ-System.map
          test -s out/drivers/misc/mediatek/connectivity/connadp.o

          echo '== no built-in connectivity driver checks =='
          ! grep -q ' mtk_wcn_common_drv_init$' ../Falcon-AZ-System.map
          ! grep -q ' wmt_ctrl_ul_cmd$' ../Falcon-AZ-System.map
          ! grep -q ' wmt_detect_driver_init$' ../Falcon-AZ-System.map
          ! grep -q ' wlanProbe$' ../Falcon-AZ-System.map
          ! grep -q ' glRegisterBus$' ../Falcon-AZ-System.map
          ! grep -q ' BT_open$' ../Falcon-AZ-System.map
          ! grep -q ' fm_ops_open$' ../Falcon-AZ-System.map
          ! grep -q ' gps_emi_unlocked_ioctl$' ../Falcon-AZ-System.map
          test -z "$(find out/drivers/misc/mediatek/connectivity/wlan -name '*.o' 2>/dev/null)"
          test -z "$(find out/drivers/misc/mediatek/connectivity/bt -name '*.o' 2>/dev/null)"
          test -z "$(find out/drivers/misc/mediatek/connectivity/gps -name '*.o' 2>/dev/null)"
          test -z "$(find out/drivers/misc/mediatek/connectivity/fmradio -name '*.o' 2>/dev/null)"
          test ! -e out/drivers/misc/mediatek/connectivity/common/common_detect/wmt_detect.o
          test ! -e out/drivers/misc/mediatek/connectivity/common/wmt_drv.o

          echo '== module loading checks =='
          grep -q 'MODULE_INIT_IGNORE_MODVERSIONS' kernel/module.c
          grep -q 'MODULE_INIT_IGNORE_VERMAGIC' kernel/module.c
          ! grep -q 'module_blacklist = "wmt_drv"' kernel/module.c
          grep -aq 'MODULE_INIT_IGNORE_MODVERSIONS' out/kernel/module.o || true
          echo 'Stock module WiFi build checks passed'

      - name: Package AnyKernel
        if: always()
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel
          cp src/out/arch/arm64/boot/Image.gz-dtb anykernel/Image.gz-dtb
          cp packaging/cph2185-anykernel.sh anykernel/anykernel.sh
          sed -i 's/^kernel.string=.*/kernel.string=Falcon-AZ Kernel by Azizur Rahman/' anykernel/anykernel.sh
          sed -i 's/^device.name1=CPH2185$/device.name1=CPH2185\ndevice.name2=CPH2179/' anykernel/anykernel.sh
          chmod +x anykernel/anykernel.sh
          grep -nE 'kernel.string|device.name' anykernel/anykernel.sh
          rm -rf anykernel/.git
          cd anykernel
          zip -r9 "../Falcon-AZ-CPH2185-CPH2179-${GITHUB_SHA::12}.zip" . \
            -x README.md -x '*placeholder' -x '.git/*'
          cd ..
          sha256sum Falcon-AZ-CPH2185-CPH2179-*.zip

      - name: Upload Falcon-AZ kernel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Falcon-AZ-CPH2185-CPH2179-${{ github.sha }}
          path: |
            Falcon-AZ-CPH2185-CPH2179-*.zip
            Falcon-AZ-config
            Falcon-AZ-System.map
          if-no-files-found: error
          retention-days: 14

      - name: Upload debug kernel files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Falcon-AZ-debug-${{ github.sha }}
          path: |
            src/out/vmlinux
            src/out/arch/arm64/boot/Image
            src/out/kernel/module.o
            src/out/include/config/kernel.release
            src/out/include/generated/utsrelease.h
            Falcon-AZ-config
            Falcon-AZ-System.map
          if-no-files-found: warn
          retention-days: 3
