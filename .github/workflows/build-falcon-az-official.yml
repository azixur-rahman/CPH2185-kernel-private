name: Build Falcon-AZ Official A15 KSU

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout packaging repo
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            binutils-aarch64-linux-gnu \
            bison \
            build-essential \
            device-tree-compiler \
            flex \
            gcc-aarch64-linux-gnu \
            libelf-dev \
            libncurses5-dev \
            libssl-dev \
            python3 \
            unzip \
            zip

      - name: Download official OPPO A15 source
        run: |
          curl -L --retry 5 --retry-all-errors -o source.tar.gz \
            "https://codeload.github.com/oppo-source/A15/tar.gz/refs/heads/main"
          mkdir -p src
          tar -xzf source.tar.gz -C src --strip-components=1
          test -f src/kernel-4.9/Makefile
          test -f src/kernel-4.9/arch/arm64/configs/oppo6765_defconfig
          mv src/kernel-4.9 kernel
          head -5 kernel/Makefile

      - name: Setup KernelSU BakaSU and SUSFS
        working-directory: kernel
        run: |
          curl -LSs "https://raw.githubusercontent.com/leonardrua/BakaSU/main/kernel/setup.sh" | bash -s main
          test -d KernelSU/kernel
          grep -q 'kernelsu' drivers/Makefile
          grep -q 'drivers/kernelsu/Kconfig' drivers/Kconfig

      - name: Add KSU config and Falcon-AZ display name
        working-directory: kernel
        run: |
          cat >> arch/arm64/configs/oppo6765_defconfig <<'EOF'

          # Falcon-AZ: KernelSU + SUSFS
          CONFIG_KSU=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_MAP=y
          EOF
          grep -q '^CONFIG_KSU=y$' arch/arm64/configs/oppo6765_defconfig
          grep -q '^CONFIG_KSU_SUSFS=y$' arch/arm64/configs/oppo6765_defconfig
          ! grep -q '^CONFIG_LOCALVERSION=' arch/arm64/configs/oppo6765_defconfig
          python3 - <<'PY'
          from pathlib import Path
          p = Path('init/version.c')
          s = p.read_text()
          if 'FALCON_AZ_RELEASE' not in s:
              needle = '#include <linux/proc_ns.h>\n'
              s = s.replace(needle, needle + '\n#define FALCON_AZ_RELEASE "4.9.190-falcon-az"\n', 1)
              s = s.replace('.release\t= UTS_RELEASE,', '.release\t= FALCON_AZ_RELEASE,', 1)
              s = s.replace('"Linux version " UTS_RELEASE', '"Linux version " FALCON_AZ_RELEASE', 1)
              p.write_text(s)
          s = p.read_text()
          assert 'FALCON_AZ_RELEASE' in s
          assert '\t.release\t= FALCON_AZ_RELEASE,' in s
          assert '"Linux version " FALCON_AZ_RELEASE' in s
          PY
          sed -n '10,45p' init/version.c

      - name: Build kernel and DTBs
        working-directory: kernel
        env:
          ARCH: arm64
          CROSS_COMPILE: aarch64-linux-gnu-
          ODM_WT_EDIT: "yes"
          VENDOR_EDIT: "1"
        run: |
          make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- oppo6765_defconfig
          make -j"$(nproc)" O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- Image.gz-dtb dtbs
          test -s out/arch/arm64/boot/Image.gz-dtb
          ls -lh out/arch/arm64/boot/Image.gz-dtb
          cp out/.config ../Falcon-AZ-config
          cp out/System.map ../Falcon-AZ-System.map || true
          echo '=== UTS_RELEASE ==='
          cat out/include/generated/utsrelease.h
          echo '=== important config ==='
          grep -E '^CONFIG_(KSU|KSU_SUSFS|LOCALVERSION|MTK_COMBO|MTK_COMBO_CHIP_CONSYS_6765|MTK_COMBO_WIFI|WLAN_DRV_BUILD_IN)' out/.config | sort
          test "$(sed -n 's/^#define UTS_RELEASE "\(.*\)"/\1/p' out/include/generated/utsrelease.h)" = "4.9.190"
          grep -q '^CONFIG_KSU=y' out/.config
          grep -q '^CONFIG_KSU_SUSFS=y' out/.config
          grep -q '^CONFIG_MTK_COMBO=y' out/.config
          grep -q '^CONFIG_MTK_COMBO_WIFI=y' out/.config
          ! grep -q '^CONFIG_WLAN_DRV_BUILD_IN=y' out/.config
          if aarch64-linux-gnu-nm out/vmlinux | grep -q ' wmt_ctrl_ul_cmd$'; then
            echo 'ERROR: built-in WMT driver found in vmlinux'
            exit 1
          fi
          strings out/vmlinux | grep -q '4.9.190-falcon-az'
          echo 'Official A15 kernel checks passed'

      - name: Package AnyKernel
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel
          cp kernel/out/arch/arm64/boot/Image.gz-dtb anykernel/Image.gz-dtb
          cp packaging/cph2185-anykernel.sh anykernel/anykernel.sh
          sed -i 's/^kernel.string=.*/kernel.string=Falcon-AZ Kernel by Azizur Rahman/' anykernel/anykernel.sh
          sed -i 's/^device.name1=CPH2185$/device.name1=CPH2185\ndevice.name2=CPH2179/' anykernel/anykernel.sh
          chmod +x anykernel/anykernel.sh
          grep -nE 'kernel.string|device.name' anykernel/anykernel.sh
          rm -rf anykernel/.git
          cd anykernel
          zip -r9 "../Falcon-AZ-CPH2185-CPH2179-${GITHUB_SHA::12}.zip" . \
            -x README.md -x '*placeholder' -x '.git/*'
          cd ..
          sha256sum Falcon-AZ-CPH2185-CPH2179-*.zip

      - name: Upload Falcon-AZ kernel
        uses: actions/upload-artifact@v4
        with:
          name: Falcon-AZ-CPH2185-CPH2179-${{ github.sha }}
          path: |
            Falcon-AZ-CPH2185-CPH2179-*.zip
            Falcon-AZ-config
            Falcon-AZ-System.map
          if-no-files-found: error
          retention-days: 14
