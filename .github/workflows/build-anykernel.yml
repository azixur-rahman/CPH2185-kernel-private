# Author: Azizur Rahman <iremm12rr@gmail.com>
name: Build CPH2185 AnyKernel

on:
  workflow_dispatch:
  push:
    branches:
      - "deprecated/android-4.9-q"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            flex \
            gcc-aarch64-linux-gnu \
            libelf-dev \
            libncurses5-dev \
            libssl-dev \
            python3 \
            unzip \
            zip

      - name: Configure kernel
        env:
          ARCH: arm64
          CROSS_COMPILE: aarch64-linux-gnu-
        run: |
          make O=out ARCH="$ARCH" CROSS_COMPILE="$CROSS_COMPILE" CPH2185_defconfig
          grep -E 'CONFIG_TOUCHSCREEN_NT36xxx_HOSTDL_SPI|CONFIG_BUILD_ARM64_APPENDED_KERNEL_IMAGE_NAME|CONFIG_BUILD_ARM64_DTB_OVERLAY_IMAGE_NAMES' out/.config

      - name: Build kernel and device trees
        env:
          ARCH: arm64
          CROSS_COMPILE: aarch64-linux-gnu-
        run: |
          make -j"$(nproc)" O=out ARCH="$ARCH" CROSS_COMPILE="$CROSS_COMPILE" Image.gz-dtb dtbs
          test -s out/arch/arm64/boot/Image.gz-dtb
          ls -lh out/arch/arm64/boot/Image.gz-dtb

      - name: Prepare AnyKernel3 package
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel
          cp out/arch/arm64/boot/Image.gz-dtb anykernel/Image.gz-dtb
          cp packaging/cph2185-anykernel.sh anykernel/anykernel.sh
          chmod +x anykernel/anykernel.sh
          rm -rf anykernel/.git
          cd anykernel
          zip -r9 "../AnyKernel-CPH2185-${GITHUB_SHA::12}.zip" . \
            -x README.md -x '*placeholder' -x '.git/*'

      - name: Upload AnyKernel zip
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel-CPH2185-${{ github.sha }}
          path: AnyKernel-CPH2185-*.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload kernel build outputs
        uses: actions/upload-artifact@v4
        with:
          name: CPH2185-kernel-debug-${{ github.sha }}
          path: |
            out/.config
            out/System.map
            out/arch/arm64/boot/Image.gz-dtb
          if-no-files-found: error
          retention-days: 14
